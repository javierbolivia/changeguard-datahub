# Example: using ChangeGuard as a CI/CD gate in GitHub Actions.
#
# This is a conceptual example, not a workflow wired into this repository.
# It shows how a schema-change PR could be evaluated with ChangeGuard's
# CLI before merging: ALLOW (exit 0) lets the job continue, BLOCK (exit 1)
# fails the job, any execution/configuration error (exit 2) also fails,
# and REVIEW (exit 3) stops deployment pending evidence verification.
#
# See contract_sentinel/cli.py and the "CI/CD Gate" section of README.md
# for the full exit-code contract (0=ALLOW, 1=BLOCK, 2=ERROR, 3=REVIEW).

name: ChangeGuard Gate

on:
  pull_request:
    paths:
      - "migrations/**"

jobs:
  changeguard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (provides uvx)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluate proposed schema change with ChangeGuard
        # A real workflow would derive --dataset/--column/--operation from
        # the PR's migration file instead of hardcoding them here.
        run: |
          set +e
          python -m contract_sentinel.cli \
            --dataset commerce.orders \
            --column customer_id \
            --operation drop \
            --mode live \
            --datahub-url ${{ secrets.DATAHUB_GMS_URL }} \
            --datahub-token ${{ secrets.DATAHUB_TOKEN }} \
            --json
          changeguard_status=$?
          set -e

          case "$changeguard_status" in
            0)
              echo "::notice title=ChangeGuard ALLOW::Schema change may proceed."
              ;;
            1)
              echo "::error title=ChangeGuard BLOCK::Policy gate rejected the schema change."
              ;;
            2)
              echo "::error title=ChangeGuard ERROR::The gate could not complete its analysis."
              ;;
            3)
              echo "::warning title=ChangeGuard REVIEW::Insufficient evidence to safely issue ALLOW."
              ;;
            *)
              echo "::error title=ChangeGuard ERROR::Unexpected exit code $changeguard_status."
              changeguard_status=2
              ;;
          esac

          # BLOCK, ERROR, and REVIEW fail the step/job; only ALLOW continues.
          exit "$changeguard_status"
